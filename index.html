<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slipstream | 1v1 Dash-Fighter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="player-panel left-panel">
                <div class="player-header">
                    <span class="player-label">PLAYER 1</span>
                    <span class="player-vs">SLIPSTREAM</span>
                </div>
                <div class="bar-group">
                    <div class="bar-title">HEALTH</div>
                    <div class="bar-track"><div id="player1-health" class="bar-fill health-fill"></div></div>
                </div>
                <div class="bar-group meter-group">
                    <div class="bar-title">METER</div>
                    <div class="bar-track"><div id="player1-meter" class="bar-fill meter-fill"></div></div>
                </div>
            </div>

            <div class="score-panel">
                <div id="round-label">Round 1 / 3</div>
                <div id="scoreboard">
                    <span id="player1-score">0</span> - <span id="player2-score">0</span>
                </div>
                <div class="timer-panel">
                    <span id="timer">60</span>
                    <button id="pause-button" class="small-button">PAUSE</button>
                </div>
            </div>

            <div class="player-panel right-panel">
                <div class="player-header right-align">
                    <span class="player-label">AI</span>
                    <span class="player-vs">CHALLENGER</span>
                </div>
                <div class="bar-group">
                    <div class="bar-title">HEALTH</div>
                    <div class="bar-track"><div id="player2-health" class="bar-fill health-fill"></div></div>
                </div>
                <div class="bar-group meter-group">
                    <div class="bar-title">METER</div>
                    <div class="bar-track"><div id="player2-meter" class="bar-fill meter-fill"></div></div>
                </div>
            </div>
        </div>

        <div id="message-overlay" class="visible">
            <div id="start-menu" class="menu-panel">
                <h1>Slipstream</h1>
                <p class="menu-description">Neon arena combat with dash, attack, and powerups. Win best-of-3 rounds against a reactive AI opponent.</p>
                <div class="button-row">
                    <button id="start-button" class="primary-button">START MATCH</button>
                    <button id="audio-toggle" class="secondary-button">AUDIO ON</button>
                </div>
                <div class="controls-grid">
                    <div><strong>Move:</strong> A / D</div>
                    <div><strong>Jump:</strong> W</div>
                    <div><strong>Block:</strong> S</div>
                    <div><strong>Dash:</strong> Q / E</div>
                    <div><strong>Attack:</strong> F</div>
                </div>
            </div>

            <div id="message-panel" class="message-panel hidden">
                <h1 id="status-message">READY?</h1>
                <p id="subtitle-message"></p>
                <button id="overlay-action" class="primary-button hidden"></button>
            </div>
        </div>

        <div id="touch-controls" class="touch-hidden">
            <button data-control="left">◀</button>
            <button data-control="right">▶</button>
            <button data-control="jump">▲</button>
            <button data-control="dash">⚡</button>
            <button data-control="attack">✦</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
